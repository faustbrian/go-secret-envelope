schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/awskms
        - ./adapters/keyring

operations:
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages: [./...]
        run: '^(TestServiceEncryptsAndDecryptsAnAuthenticatedEnvelope|TestServiceRejectsAContextSwap|TestServiceErrorsDoNotRenderSecretsOrProviderCauses|TestServiceEntropyErrorsDoNotExposeCauses|TestServicePreservesOnlySafeProviderCancellation|TestContextIsCanonicalAndImmutable|TestEnvelopeParsingRejectsMalformedOrOversizedInput|TestEnvelopeAcceptsExactSizeLimits|TestServiceRejectsInvalidKeyMaterialAndEntropy|TestProviderGeneratesAnAES256DataKey|TestProviderDecryptsWithTheExactKeyAndContext|TestProviderRejectsMalformedResponsesWithoutRenderingClientErrors|TestProviderRejectsOversizedRequestsBeforeKMS|TestProviderRejectsInvalidGenerateResponsesAndZeroizesKeys|TestProviderRejectsDecryptFailuresAndMalformedResponses|TestOperationErrorDoesNotExposeCause|TestOperationErrorPreservesOnlySafeCancellation|TestSignatureVerifierAuthenticatesExactRawMessage|TestSignatureVerifierAcceptsExactRequestLimits|TestSignatureVerifierRejectsInvalidConstructionAndRequests|TestSignatureVerifierClassifiesFailuresWithoutRenderingCauses|TestSignatureVerifierAcceptsReviewedRawAlgorithms|TestProviderWrapsAndUnwrapsDataKeysByReferenceAndContext|TestProviderAcceptsDocumentedKeyringBounds|TestProviderRejectsEntropyFailures|TestProviderAuthenticatesReferenceContextAndCiphertext|TestProviderUsesExactBoundedWireAllocations)$'
        count: 1
        timeout: 10m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzParseEnvelope$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: .
        budget: 100ms
        timeout: 20m
